name: attest-selftest

# The repo continuously attests its own history: the archived receipt of the
# recorded ECDSA run is verified against the exact files that run's commit
# changed. If this gate ever goes red, either the archive was tampered with
# or attest itself regressed — both are stop-the-line events.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  attest-archived-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: attest the recorded ECDSA run against its actual commit
        run: |
          CHANGED=$(git diff-tree --no-commit-id --name-only -r cd1c102)
          # --root: the receipt predates write-time relativization, so its
          # claims carry the recording machine's absolute paths. Immutable
          # evidence doesn't get rewritten; the verifier gets told its origin.
          node dist/cli.js attest \
            --ledger docs/runs/2026-06-10-ecdsa-self-implementation/ledger.jsonl \
            --root /Users/katya/Files/TestField/NightWatch \
            --changed $CHANGED \
            --scope "src/**" "tests/**" "CHANGELOG.md"

  attest-via-marketplace-action:
    # E2E for the composite action itself: same archived receipt, but through
    # action.yml + the npm-published CLI — the exact path Marketplace users take.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: files
        run: echo "list=$(git diff-tree --no-commit-id --name-only -r cd1c102 | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          ledger: docs/runs/2026-06-10-ecdsa-self-implementation/ledger.jsonl
          changed: ${{ steps.files.outputs.list }}
          root: /Users/katya/Files/TestField/NightWatch
          scope: 'src/** tests/** CHANGELOG.md'
          version: '0.4.0'
