name: 'NightWatch Attest'
description: 'Gate AI-authored PRs on a verifiable run ledger — no receipt, no review.'
branding:
  icon: 'moon'
  color: 'purple'

inputs:
  ledger:
    description: 'Path to the committed run ledger (the receipt), e.g. .nightwatch-receipt.jsonl'
    required: true
  base:
    description: 'Base git ref to diff against (e.g. origin/main or the PR base)'
    required: false
    default: ''
  changed:
    description: 'Explicit space-separated changed-file list (overrides base)'
    required: false
    default: ''
  root:
    description: 'Project root the receipt was recorded under (legacy absolute-path receipts)'
    required: false
    default: ''
  scope:
    description: 'Space-separated scope globs the change must stay inside (optional)'
    required: false
    default: ''
  pubkey:
    description: 'Path to the public signing key PEM (optional; enables signature verification)'
    required: false
    default: ''
  strict:
    description: 'Treat warnings as failures'
    required: false
    default: 'false'
  version:
    description: 'nightwatch-agent version to install'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Install nightwatch-agent
      shell: bash
      run: npm install -g "nightwatch-agent@${{ inputs.version }}"
    - name: Attest the change set against the ledger
      shell: bash
      run: |
        ARGS=(--ledger "${{ inputs.ledger }}")
        if [ -n "${{ inputs.changed }}" ]; then
          # shellcheck disable=SC2206
          ARGS+=(--changed ${{ inputs.changed }})
        elif [ -n "${{ inputs.base }}" ]; then
          ARGS+=(--base "${{ inputs.base }}")
        else
          echo "::error::either 'base' or 'changed' must be provided" >&2
          exit 1
        fi
        if [ -n "${{ inputs.root }}" ]; then
          ARGS+=(--root "${{ inputs.root }}")
        fi
        if [ -n "${{ inputs.scope }}" ]; then
          # shellcheck disable=SC2206
          ARGS+=(--scope ${{ inputs.scope }})
        fi
        if [ -n "${{ inputs.pubkey }}" ]; then
          ARGS+=(--pubkey "${{ inputs.pubkey }}")
        fi
        if [ "${{ inputs.strict }}" = "true" ]; then
          ARGS+=(--strict)
        fi
        nightwatch attest "${ARGS[@]}"
